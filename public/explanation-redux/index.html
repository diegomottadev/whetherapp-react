<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How Redux works here · Weather</title>
<meta name="description" content="Step by step walkthrough of how the Weather app uses Redux Toolkit.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Standalone page, served next to the app (it doesn't use React). The text for both languages lives in the script below. */
  :root {
    color-scheme: light dark;
    --bg: #f3f6f9;
    --surface: #ffffff;
    --sunken: #e9eef3;
    --fg: #17222d;
    --muted: #556472;
    --line: #8796a5;
    --accent: #c76a00;
    --accent-soft: #fff1df;
    --sky: #1f6fb2;
    --sky-soft: #e3effa;
    --ok: #1d7a46;
    --bad: #b3261e;
    --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f161d; --surface: #17212b; --sunken: #121b23; --fg: #e6edf3; --muted: #9fb0bf;
      --line: #6f8293; --accent: #f2a03d; --accent-soft: #3a2a14; --sky: #78b6ea; --sky-soft: #15283a;
      --ok: #5cc98a; --bad: #f08a80;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
  a { color: var(--sky); }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 20px 8px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--sunken);
  }
  .back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .lang { display: flex; gap: 6px; }
  .lang button {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--fg);
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
  .flag { font-size: 18px; line-height: 1; }

  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }

  header.intro { max-width: 760px; margin-bottom: 28px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.2vw, 46px); line-height: 1.05; margin: 0 0 14px; text-wrap: balance; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 2.6vw, 28px); margin: 0 0 6px; text-wrap: balance; }
  .lede { font-size: 17px; color: var(--muted); margin: 0; }
  .rule-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
  .rule-strip li { background: var(--surface); border: 1px solid var(--sunken); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
  .rule-strip b { color: var(--accent); font-weight: 600; }

  /* ---------- Stepper ---------- */
  .stepper { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: 0 1px 2px rgba(10,30,50,.06), 0 10px 30px rgba(10,30,50,.06); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab { font: inherit; font-size: 14px; font-weight: 500; color: var(--fg); background: var(--sunken); border: 1px solid transparent; border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--fg); color: var(--surface); }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 820px) { .panel { grid-template-columns: minmax(0, 1fr); } }
  .panel-col { min-width: 0; }

  .diagram { overflow-x: auto; }
  .diagram svg { display: block; width: 100%; max-width: 900px; margin: 0 auto; min-width: 560px; height: auto; color: var(--fg); }
  .band { fill: var(--sunken); }
  .band-label { font: 600 11px var(--font-mono); letter-spacing: .08em; fill: var(--muted); text-transform: uppercase; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; transition: fill .2s, stroke .2s; }
  .node .t { font: 600 14px var(--font-body); fill: var(--fg); }
  .node .s { font: 400 11.5px var(--font-mono); fill: var(--muted); }
  .node.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.4; opacity: .35; transition: opacity .2s, stroke .2s; }
  .edge.dashed { stroke-dasharray: 5 4; }
  .edge.on { stroke: var(--accent); opacity: 1; stroke-width: 2.6; }
  .elabel { font: 500 11.5px var(--font-mono); fill: var(--muted); opacity: .45; transition: opacity .2s; }
  .elabel.on { fill: var(--accent); opacity: 1; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .node rect, .edge, .elabel { transition: none; } }

  .count { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin: 0 0 4px; }
  .panel h3 { font-family: var(--font-display); font-size: 22px; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
  .panel p { margin: 0 0 10px; }
  .why { background: var(--sky-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .why b { color: var(--sky); }
  .block { margin-top: 12px; }
  .block:first-child { margin-top: 0; }
  .block-h { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .block-h .file { text-transform: none; letter-spacing: 0; color: var(--sky); }
  pre { margin: 0; background: var(--sunken); border-radius: 10px; padding: 10px 12px; font: 12.5px/1.5 var(--font-mono); overflow-x: auto; white-space: pre; }
  pre.none { color: var(--muted); font-style: italic; }
  .k-status-success { color: var(--ok); font-weight: 600; }
  .k-status-error { color: var(--bad); font-weight: 600; }
  .k-status-loading, .k-status-idle { color: var(--accent); font-weight: 600; }

  .controls { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 999px; padding: 0 16px; min-height: 44px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1003; }
  .btn:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font: 500 11px var(--font-mono); color: var(--muted); cursor: pointer; padding: 0; }
  .dot[aria-current="step"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
  .hint { font-size: 12.5px; color: var(--muted); margin-left: auto; }

  /* ---------- Before / after ---------- */
  section.compare, section.whys { margin-top: 48px; }
  .section-lede { color: var(--muted); margin: 0 0 14px; max-width: 720px; }
  .compare figure { margin: 0; background: var(--surface); border-radius: var(--radius); padding: 18px; }
  .compare .scroll { overflow-x: auto; }
  .compare svg { display: block; width: 100%; min-width: 560px; height: auto; color: var(--fg); }
  figcaption { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
  .cmp-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .cmp-hot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.2; }
  .cmp-t { font: 600 13.5px var(--font-body); fill: var(--fg); }
  .cmp-s { font: 400 11px var(--font-mono); fill: var(--muted); }
  .cmp-head { font: 700 15px var(--font-display); fill: var(--fg); }
  .cmp-line { stroke: var(--line); stroke-width: 1.4; fill: none; }
  .cmp-lab { font: 500 11px var(--font-mono); fill: var(--muted); }

  /* ---------- Why cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  .choice { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .choice h3 { font-size: 15.5px; margin: 0; line-height: 1.3; }
  .choice h3 code { font-family: var(--font-mono); font-size: 14px; color: var(--accent); }
  .choice p { margin: 0; font-size: 14px; }
  .choice .alt { color: var(--muted); font-size: 13px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .choice .where { font-family: var(--font-mono); font-size: 12px; color: var(--sky); margin-top: auto; }
  code { font-family: var(--font-mono); font-size: .92em; }
</style>

<script>
  // Code is the same in both languages: it's the real code from the repo.
  const CODE = {
    initial: `const idleEntry = { status: STATUS.IDLE, weather: null,
                    error: null, requestId: null };

const initialState = {
  byCity: CITIES.reduce(
    (byCity, city) => ({ ...byCity, [city.id]: idleEntry }), {}),
};`,
    loadCity: `const loadCity = useCallback(city => {
  const previous = requests.current[city.id];
  if (previous) {
    previous.abort();
  }
  requests.current[city.id] = dispatch(fetchWeather(city));
}, [dispatch]);

useEffect(() => {
  CITIES.forEach(loadCity);
  ...
}, [loadCity]);`,
    thunk: `export const fetchWeather = createAsyncThunk(
  'weather/fetchWeather',
  async (city, { signal }) =>
    toWeather(await fetchCurrentWeather(city, { signal }))
);`,
    pending: `.addCase(fetchWeather.pending, (state, action) => {
  state.byCity[action.meta.arg.id] = {
    status: STATUS.LOADING,
    weather: null,
    error: null,
    requestId: action.meta.requestId,
  };
})`,
    select: `const weatherByCity = useSelector(selectWeatherByCity);
...
<WeatherList cities={CITIES}
             weatherByCity={weatherByCity}
             onRetry={loadCity} />`,
    api: `const buildWeatherUrl = ({ lat, lon }, apiKey) => {
  const params = new URLSearchParams({
    lat, lon, appid: apiKey, units: 'metric', lang: 'en' });
  return \`\${BASE_URL}?\${params}\`;
};

return fetch(buildWeatherUrl(coords, apiKey), { signal })
  .then(response => {
    if (!response.ok) throw new Error(ERROR_MESSAGES[...]);
    return response.json();

          ['Llega la respuesta', 'OpenWeatherMap devuelve el JSON. api/ lo pasa al thunk, toWeather se queda con lo que usa la UI, y el thunk despacha fulfilled con el clima en payload.', 'El thunk <b>no toca el store</b> directamente: solo despacha una acción con los datos.'],
          ['El reducer guarda el clima', 'El reducer compara: ¿r1 sigue siendo la última request de Cusco? Sí. Entonces guarda el clima, pone status success y limpia el requestId.', 'El chequeo de <b>requestId</b> es lo que frena respuestas viejas (mirá el escenario "Respuesta vieja").'],
          ['La tarjeta muestra el clima', 'useSelector vuelve a avisar, App se redibuja y pasa el clima por props. withError y withLoading dejan pasar a WeatherData, y aparece 11°C Cloudy.', 'Las 2 acciones (pending y fulfilled) son exactamente lo que vas a ver en <b>Redux DevTools</b>, una por lugar.'],
        ],
        [
          ['Un pedido en curso', 'Igual que al abrir la página: salió pending, el reducer anotó loading con requestId r2 y fetchWeather está esperando a OpenWeatherMap.', 'Cada lugar tiene su propia entrada en <b>byCity</b>, así que lo que pase acá no toca a los otros 8.'],
          ['La API responde 503', 'El servidor falla. api/openWeather.js ve que la respuesta no es 2xx y tira un Error con un mensaje legible. El thunk lo atrapa y despacha rejected.', 'Los mensajes legibles salen de <b>ERROR_MESSAGES</b> en api/, no del reducer.'],
          ['El reducer anota el error', 'El requestId coincide y no fue cancelado, así que el reducer pone status error y guarda el mensaje. Si el mensaje viniera vacío, usa "Something went wrong."', 'El mensaje <b>nunca va vacío</b>: withError lo usa para decidir si muestra el error.'],
          ['La tarjeta muestra el error', 'useSelector avisa, App pasa props, y en WeatherCard el HOC withError ve un error y muestra "Couldn\'t load the weather." con el botón Try again.', 'Elegir qué mostrar es trabajo de los <b>HOCs</b>. Redux solo guarda el status.'],
          ['Tocás "Try again"', 'El botón llama a onRetry, una función que vino por props desde App. Es loadCity: cancela la request anterior si quedó alguna y hace un dispatch nuevo.', 'La tarjeta <b>no despacha</b> nada: solo llama a una función. App sigue siendo el único que habla con Redux.'],
          ['Empieza de nuevo', 'Sale un pending nuevo con otro requestId (r3), el reducer pone loading, y desde acá sigue igual que en "Abrir la página".', 'Cada intento tiene su <b>requestId</b>, así que si el viejo apareciera tarde, no pisaría al nuevo.'],
        ],
        [
          ['Un pedido lento: r4', 'Se pidió el clima de Cusco (r4), pero la red está lenta y la respuesta tarda.', 'El store recuerda <b>cuál es la última request</b>: hoy es r4.'],
          ['Sale un pedido nuevo: r5', 'Antes de que r4 termine, sale otro pedido para Cusco (r5). Su pending reemplaza el requestId guardado: ahora la última es r5.', 'App además llama a <b>abort()</b> sobre r4 antes de pedir r5. El requestId es la segunda red de seguridad.'],
          ['r5 llega primero', 'La respuesta nueva llega rápido. requestId r5 coincide, así que el reducer la guarda: Cusco muestra 30°C.', 'Lo que ves corresponde siempre al <b>último pedido</b>, no al que respondió último.'],
          ['r4 aparece tarde y se descarta', 'Por fin llega r4, con datos viejos. El reducer compara: el requestId guardado ya no es r4, así que hace return sin tocar nada. Cusco sigue en 30°C.', 'Sin este chequeo, el dato viejo <b>pisaría al nuevo</b> y verías el clima equivocado. 2 tests lo cubren.'],
        ],
        [
          ['Pedidos en curso', 'Los 9 lugares están cargando. App guardó en requests (un useRef) lo que devolvió cada dispatch: una promesa con un método abort().', '<b>dispatch(fetchWeather(...))</b> devuelve ese "control remoto" gracias a createAsyncThunk.'],
          ['App se desmonta', 'La limpieza del useEffect recorre los pedidos guardados y llama a abort() en cada uno. El signal corta el fetch en api/.', 'Así no queda <b>trabajo colgado</b> ni respuestas que lleguen a una pantalla que ya no existe.'],
          ['Sale "rejected" con aborted: true', 'Un instante después, el thunk despacha rejected marcado como cancelado. Esta demora es la razón por la que no usé la opción condition.', 'Con <b>condition</b>, un montaje rápido vería Cusco todavía en loading y no pediría nada.'],
          ['Cusco vuelve a idle', 'El requestId coincide y fue cancelado, así que el reducer vuelve Cusco a idle. Si App se monta otra vez, pide el clima de cero.', 'Si quedara en <b>loading</b> o en <b>error</b>, la próxima vez la tarjeta mostraría algo que no pasó.'],
        ],
      ],
      cmpH: 'Qué cambió al meter Redux',
      cmpP: 'Los componentes que se ven no cambiaron. Lo único que se movió es dónde viven los datos y quién los pide.',
      cmpBefore: 'Antes (rama revisit-2026)', cmpNow: 'Ahora (rama redux-toolkit)',
      cmpUseState: 'useState: los datos', cmpSetState: 'setState con cada respuesta',
      cmpData: 'los datos', cmpRequest: 'el pedido', cmpAppNow: 'useSelector + dispatch (nada más)',
      cmpReads: 'lee', cmpDispatches: 'despacha', cmpSame: 'WeatherList, WeatherCard, … (iguales)',
      cmpLabel: 'Antes, App guardaba el estado con useState y hacía fetch. Ahora el estado está en el store, fetchWeather hace el pedido, y App solo despacha y lee.',
      cmpCaption: 'Las cajas naranjas son las que cambiaron. Abajo, los 16 componentes que se ven quedaron exactamente igual: siguen recibiendo los mismos props.',
      whyH: 'Por qué está configurado así',
      whyP: 'Cada decisión sigue la documentación oficial de Redux (redux.js.org) o resuelve un problema concreto de esta app. Debajo de cada una está lo que no elegí y por qué.',
      cards: [
        ['<code>configureStore</code> de Redux Toolkit', 'Crea el store y ya trae tres cosas armadas: el middleware de thunk (para pedir a la API), Redux DevTools y avisos si alguien modifica el estado por fuera de las reglas.', 'No usé <code>createStore</code>: la doc la marca como vieja y habría que configurar todo eso a mano.', 'src/store/index.js'],
        ['Un slice en <code>features/weather/</code>', 'Todo lo del clima (estado inicial, reducer, thunk, selectores) vive en un archivo. Si mañana hay favoritos, van en <code>features/favorites/</code> sin tocar el clima.', 'No separé en carpetas <code>actions/</code> y <code>reducers/</code>: la guía de estilo de Redux recomienda agrupar por feature.', 'src/features/weather/weatherSlice.js'],
        ['Estado indexado por id: <code>byCity[id]</code>', 'Para leer Cusco se va directo a <code>byCity.cusco</code>, sin recorrer una lista. Cada lugar cambia sin tocar a los otros 8.', 'No usé un array de lugares: habría que buscar el lugar en cada acción, y la doc recomienda datos indexados por id.', 'initialState en weatherSlice.js'],
        ['<code>createAsyncThunk</code> para pedir el clima', 'Un reducer tiene que ser instantáneo y no puede esperar a internet. El thunk sí espera, y avisa con 3 acciones: <code>pending</code>, <code>fulfilled</code> y <code>rejected</code>.', 'No escribí las 3 acciones a mano: <code>createAsyncThunk</code> las genera, con <code>requestId</code> y <code>signal</code> incluidos.', 'fetchWeather en weatherSlice.js'],
        ['<code>requestId</code>: la última request gana', 'Cada pedido tiene un id. El reducer solo acepta la respuesta del último pedido de ese lugar, así una respuesta lenta y vieja nunca pisa a una nueva.', 'Sin esto, el orden en que responde internet decidiría qué ves. Lo cubren 2 tests.', 'addCase fulfilled / rejected'],
        ['<code>abort()</code> y vuelta a <code>idle</code>', 'App guarda lo que devuelve cada dispatch y llama a <code>abort()</code> antes de reintentar o al desmontarse. Un lugar cancelado vuelve a <code>idle</code> para cargar de nuevo la próxima vez.', 'Si quedara en <code>loading</code> o en <code>error</code>, al volver a montar App la tarjeta mostraría algo falso.', 'App.jsx + addCase rejected'],
        ['Sin la opción <code>condition</code>', 'La doc ofrece <code>condition</code> para no pedir 2 veces. La probé y un test la atrapó: al desmontar y montar rápido, la cancelación llega un instante tarde y <code>condition</code> bloqueaba el pedido nuevo. La tarjeta quedaba en skeleton para siempre.', 'Eso pasa con el doble montaje de StrictMode en React 18. App ya cancela antes de pedir, así que no hace falta.', 'comentario arriba de fetchWeather'],
        ['Solo App usa <code>useSelector</code> y <code>useDispatch</code>', 'Un único componente habla con el store. Los otros 16 reciben props, así que se pueden entender y testear sin saber que existe Redux.', 'No usé <code>connect</code>: la doc recomienda hooks. Y no conecté cada tarjeta, para no repartir el acceso al store por toda la app.', 'src/components/App/App.jsx'],
        ['Selectores', '<code>selectWeatherByCity</code> y <code>selectCityWeather</code> son el único lugar que sabe la forma del estado. Si mañana cambia, se arregla ahí.', 'Escribir <code>state.weather.byCity</code> en cada componente funciona, pero ata la UI a la forma interna del store.', 'weatherSlice.js'],
        ['<code>&lt;Provider&gt;</code> en index.jsx', 'Conecta React con el store. Sin él, <code>useSelector</code> no sabe de dónde leer.', 'Va lo más arriba posible, envolviendo a App, como indica la doc.', 'src/index.jsx'],
        ['<code>setupStore</code> + <code>renderWithProviders</code>', 'Cada test arranca con un store nuevo y limpio, y renderiza la app real con su Provider. Es el patrón de la guía oficial de testing de Redux.', 'Mockear el store o <code>useSelector</code> probaría menos: así el test pasa por el reducer de verdad.', 'src/store/index.js · src/test-utils.jsx'],
        ['React-Redux 8, no 9', 'React-Redux 9 pide React 18, y la app sigue en React 16.14. La 8.1.3 es la última que funciona con React 16. Redux Toolkit 2 acepta las dos.', 'Subir a React 18 era otro cambio grande, fuera de lo pedido.', 'package.json'],
        ['Por qué no RTK Query', 'La doc también recomienda RTK Query para pedir datos, y habría resuelto caché y reintentos con menos código. Pero esconde el reducer, las acciones y el thunk.', 'Acá la idea era aprender cómo funciona Redux por dentro, así que elegí ver cada pieza.', 'decisión de diseño'],
      ],
    },
  };

  const LANGS = ['en', 'es'];
  const STORAGE_KEY = 'redux-explanation-lang';
  const $ = id => document.getElementById(id);
  const FLOW_IDS = [...document.querySelectorAll('#flow-svg [id^="n-"], #flow-svg [id^="e-"], #flow-svg [id^="l-"]')];

  // English by default. The choice is saved in this browser only; storage can fail, so every access is guarded.
  const readSavedLang = () => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return LANGS.includes(saved) ? saved : 'en';
    } catch (error) {
      return 'en';
    }
  };
  const saveLang = value => {
    try {
      localStorage.setItem(STORAGE_KEY, value);
    } catch (error) {
      // Not saved. The page still works, it just starts in English next time.
    }
  };

  let lang = readSavedLang();
  let sc = 0;
  let st = 0;

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const colorState = s => esc(s).replace(/status:(\s+)'(\w+)'/, (m, sp, v) => `status:${sp}<span class="k-status-${v}">'${v}'</span>`);

  function renderStatic() {
    const t = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = t.docTitle;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
    document.querySelectorAll('[data-i18n-label]').forEach(el => el.setAttribute('aria-label', t[el.dataset.i18nLabel]));
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('flow-svg').setAttribute('aria-label', t.flowLabel);
    $('cmp-svg').setAttribute('aria-label', t.cmpLabel);
    $('rules').setAttribute('aria-label', t.rulesLabel);
    $('rules').innerHTML = t.rules.map((rule, i) => `<li><b>${i + 1}.</b> ${rule}</li>`).join('');
    $('why-grid').innerHTML = t.cards.map(([h, p, alt, where]) =>
      `<article class="choice"><h3>${h}</h3><p>${p}</p><p class="alt">${alt}</p><span class="where">${where}</span></article>`).join('');
    renderTabs();
  }

  function renderTabs() {
    const t = TEXT[lang];
    $('tabs').innerHTML = t.tabs.map((label, i) =>
      `<button class="tab" role="tab" type="button" aria-selected="${i === sc}" data-i="${i}">${label}</button>`).join('');
    $('tabs').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      sc = Number(b.dataset.i);
      st = 0;
      renderTabs();
      renderStep();
    }));
  }

  function renderStep() {
    const t = TEXT[lang];
    const scenario = SCENARIOS[sc];
    const step = scenario.steps[st];
    const [title, text, why] = t.steps[sc][st];
    FLOW_IDS.forEach(el => {
      const on = step.on.includes(el.id);
      el.classList.toggle('on', on);
      if (el.id.startsWith('e-')) el.setAttribute('marker-end', on ? 'url(#arr-on)' : 'url(#arr)');
    });
    $('card-state').textContent = step.card;
    $('count').textContent = t.count(t.tabs[sc], st + 1, scenario.steps.length);
    $('title').textContent = title;
    $('text').textContent = text;
    $('why').innerHTML = `<b>${t.whyPrefix}</b> ${why}`;
    const action = $('action');
    if (step.action) {
      action.className = '';
      action.textContent = step.action;
    } else {
      action.className = 'none';
      action.textContent = t.noAction;
    }
    $('state-h').textContent = t.stateH(scenario.place);
    $('state').innerHTML = colorState(step.state);
    $('file').textContent = step.file;
    $('code').textContent = CODE[step.code];
    $('prev').disabled = st === 0;
    $('next').disabled = st === scenario.steps.length - 1;
    $('dots').setAttribute('aria-label', lang === 'en' ? 'Steps' : 'Pasos');
    $('dots').innerHTML = scenario.steps.map((_, i) =>
      `<button class="dot" type="button" data-i="${i}" aria-label="${t.stepLabel(i + 1)}" ${i === st ? 'aria-current="step"' : ''}>${i + 1}</button>`).join('');
    $('dots').querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => {
      st = Number(d.dataset.i);
      renderStep();
    }));
  }

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    saveLang(lang);
    renderStatic();
    renderStep();
  }));
  $('prev').addEventListener('click', () => { if (st > 0) { st -= 1; renderStep(); } });
  $('next').addEventListener('click', () => { if (st < SCENARIOS[sc].steps.length - 1) { st += 1; renderStep(); } });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowRight') $('next').click();
    if (event.key === 'ArrowLeft') $('prev').click();
  });

  renderStatic();
  renderStep();
</script>
</body>
